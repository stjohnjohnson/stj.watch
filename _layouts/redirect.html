{% if page.extra_life_donation %}
{% capture target %}https://www.extra-life.org/index.cfm?fuseaction=donordrive.participant&participantID={{ site.extra_life_participant_id }}#donate{% endcapture %}
{% else %}
{% assign target = page.target %}
{% endif %}
<!DOCTYPE html>
<html>

<body>
    <script type="application/javascript">
        window.location.replace({{ target | jsonify }});
    </script>
    <p>Redirecting to <a href="{{ target | escape }}">{{ target | escape }}</a>...</p>
</body>

</html>
